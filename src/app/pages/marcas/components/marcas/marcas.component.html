<p-toast />
<div class="page-breadcrumb-bar flex flex-column">
    <p-breadcrumb class="app-breadcrumb max-w-full" [model]="breadcrumb" />
</div>
<div class="flex flex-column gap-2">
    <p-panel class="w-12 page-panel">
        <ng-template pTemplate="header">
            <div class="page-panel-title-group">
                <span class="page-panel-title-chip"><i class="pi pi-tag"></i></span>
                <div class="page-panel-title-text">
                    <span class="p-panel-title">Marcas</span>
                    <span class="page-panel-subtitle">
                        Marcas de los artículos
                        <span class="page-panel-count" *ngIf="marcas?.totalElements !== undefined">{{ marcas.totalElements }} registros</span>
                    </span>
                </div>
            </div>
        </ng-template>
        <ng-template pTemplate="icons">
            <div class="flex w-12 gap-2">
                <p-button
                    [label]="filtrosVisibles ? 'Ocultar Filtros' : 'Mostrar Filtros'"
                    [icon]="filtrosVisibles ? 'pi pi-chevron-up' : 'pi pi-filter'"
                    [badge]="filtrosActivos ? filtrosActivos.toString() : undefined"
                    class="page-panel-header-action"
                    (onClick)="filtrosVisibles = !filtrosVisibles"
                />
                <p-button label="Agregar" icon="pi pi-plus" class="page-panel-primary-action" (onClick)="displayFormulario()" />
            </div>
        </ng-template>

        <div class="filters-collapse" [class.filters-collapse--open]="filtrosVisibles">
            <div class="page-filters flex w-12 flex-column md:flex-row gap-2 mb-3">
                <input type="text" class="w-12" pInputText placeholder="Nombre" [(ngModel)]="filtro.nombre" (keyup.enter)="buscar()" />
                <p-button label="Buscar" [fluid]="true" class="w-12 md:w-3" severity="info" icon="pi pi-search" [outlined]="true" (onClick)="buscar()" />
                <p-button label="Limpiar" [fluid]="true" class="w-12 md:w-3" severity="secondary" icon="pi pi-filter-slash" [outlined]="true" (onClick)="limpiarFiltros()" />
            </div>
        </div>

        <div class="hidden md:block">
            <p-table [value]="marcas && marcas.content ? marcas.content : []" id="marcas-table" [loading]="loading">
                <ng-template #header>
                    <tr>
                        <th>Id</th>
                        <th>Nombre</th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template #body let-item>
                    <tr>
                        <td class="page-cell-muted">{{ item.id }}</td>
                        <td class="page-cell-strong">
                            <span class="page-cell-icon"><i class="pi pi-tag"></i>{{ item.nombre }}</span>
                        </td>
                        <td class="text-right">
                            <p-button pTooltip="Editar" tooltipPosition="left" icon="pi pi-pencil" [rounded]="true" [text]="true" class="page-row-action" (click)="editar(item)" />
                            <p-button pTooltip="Desactivar" tooltipPosition="left" icon="pi pi-ban" [rounded]="true" [text]="true" severity="danger" (click)="confirmarDesactivar(item)" />
                        </td>
                    </tr>
                </ng-template>
                <ng-template #summary>
                    <p-paginator styleClass="page-paginator" (onPageChange)="pageChange($event)" [first]="filtro.page * filtro.size" [rows]="filtro.size" [totalRecords]="marcas ? marcas.totalElements : 0" [rowsPerPageOptions]="[10, 20, 30]" />
                </ng-template>
                <ng-template #emptymessage>
                    <tr>
                        <td colspan="3">
                            <div class="page-empty">
                                <i class="pi pi-search"></i>
                                <strong>No se encontraron marcas</strong>
                                <span>Prueba con otros filtros.</span>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
        <ng-container *ngIf="marcas && marcas.content">
            <app-table-mobile
                [size]="filtro.size"
                [page]="filtro.page"
                (pageChange)="pageChange($event)"
                [mostrarAcciones]="true"
                [acciones]="accionesItems"
                (accion)="resolverAccion($event)"
                [data]="marcas.content"
                [campos]="campos"
            ></app-table-mobile>
        </ng-container>
    </p-panel>
</div>
<p-dialog *ngIf="marca" [header]="marca && marca.id == 0 ? 'Crear Marca' : 'Editar Marca'" [modal]="true" [(visible)]="visible" [breakpoints]="{ '780px': '50vw', '575px': '90vw' }" [style]="{ width: '50vw' }">
    <div class="flex flex-column w-12 gap-2">
        <div class="flex flex-column w-12 gap-2">
            <label for="nombre" class="font-semibold">Nombre</label>
            <input pInputText id="nombre" class="flex-auto" autocomplete="off" [(ngModel)]="marca.nombre" />
        </div>
        <div class="flex flex-column w-12 gap-2">
            <label for="descripcion" class="font-semibold">Descripción</label>
            <textarea pInputTextarea id="descripcion" class="flex-auto" autocomplete="off" [(ngModel)]="marca.descripcion" rows="5"></textarea>
        </div>
    </div>
    <ng-template #footer>
        <p-button label="Cancelar" [text]="true" severity="secondary" class="w-12" [fluid]="true" (click)="cerrarModal()" />
        <p-button [label]="marca && marca.id == 0 ? 'Guardar' : 'Actualizar'" class="w-12" [fluid]="true" severity="success" (click)="guardar()" />
    </ng-template>
</p-dialog>
<p-confirmdialog #cDesactive key="cDesactive" header="Desactivar Marca">
    <ng-template #message let-message>
        <div class="flex flex-col items-center w-full gap-4 border-b border-surface-200 dark:border-surface-700">
            <i class="pi pi-ban !text-6xl text-red-500"></i>
            <p>¿Desea desactivar la marca {{ marca?.nombre }}?</p>
        </div>
    </ng-template>
    <ng-template #footer>
        <p-button label="Cancelar" class="w-12" [fluid]="true" severity="secondary" [text]="true" (click)="cDesactive.onReject()" />
        <p-button label="Desactivar" class="w-12" [fluid]="true" severity="danger" (click)="cDesactive.onAccept()" />
    </ng-template>
</p-confirmdialog>
<app-modal-loading [visible]="loading"></app-modal-loading>
