<div class="flex flex-column gap-2">
    <div class="page-breadcrumb-bar flex flex-column">
        <p-breadcrumb class="app-breadcrumb max-w-full" [model]="breadcrumb" />
    </div>
    <p-panel class="w-12 page-panel">
        <ng-template pTemplate="header">
            <div class="page-panel-title-group">
                <span class="page-panel-title-chip"><i class="pi pi-cart-arrow-down"></i></span>
                <div class="page-panel-title-text">
                    <span class="p-panel-title">Ingresos a Bodega</span>
                    <span class="page-panel-subtitle">
                        Recepción de mercadería en bodega
                        <span class="page-panel-count" *ngIf="total !== undefined">{{ total }} registros</span>
                    </span>
                </div>
            </div>
        </ng-template>
        <ng-template pTemplate="icons">
            <div class="flex w-12 gap-2">
                <p-button
                    [label]="filtrosVisibles ? 'Ocultar Filtros' : 'Mostrar Filtros'"
                    [icon]="filtrosVisibles ? 'pi pi-chevron-up' : 'pi pi-filter'"
                    [badge]="filtrosActivos ? filtrosActivos.toString() : undefined"
                    class="page-panel-header-action"
                    (onClick)="filtrosVisibles = !filtrosVisibles"
                />
                <p-button label="Nuevo" icon="pi pi-plus" class="page-panel-primary-action" [routerLink]="['/ingresos/formulario']" />
            </div>
        </ng-template>

        <div class="filters-collapse" [class.filters-collapse--open]="filtrosVisibles">
            <div class="page-filters flex w-12 flex-column md:flex-row gap-2 mb-3">
                <input type="number" class="w-12" pInputText placeholder="Folio" [(ngModel)]="filtro.id" (keyup.enter)="buscar()" />
                <p-select class="w-12" [options]="opcionesEstado" [(ngModel)]="filtro.estado" optionLabel="label" optionValue="value" placeholder="Estado" [showClear]="true" appendTo="body" />
                <p-button label="Buscar" [fluid]="true" class="w-12 md:w-3" severity="info" icon="pi pi-search" [outlined]="true" (onClick)="buscar()" />
                <p-button label="Limpiar" [fluid]="true" class="w-12 md:w-3" severity="secondary" icon="pi pi-filter-slash" [outlined]="true" (onClick)="limpiarFiltros()" />
            </div>
        </div>

        <app-ingresos-table #tabla [filtros]="false" [filtro]="filtro" [titulo]="false" [agregar]="false" [acciones]="true" [card]="false" (buscado)="onBuscado($event)"></app-ingresos-table>
    </p-panel>
</div>
