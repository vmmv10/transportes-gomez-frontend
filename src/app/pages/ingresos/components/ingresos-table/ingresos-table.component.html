<div class="{{ card ? 'card' : '' }} flex flex-column gap-2 md:gap-4">
    <div class="page-header" *ngIf="agregar || titulo">
        <div class="page-panel-title-group">
            <span class="page-panel-title-chip"><i class="pi pi-cart-arrow-down"></i></span>
            <div class="page-panel-title-text">
                <h2 class="page-header__title" *ngIf="titulo">Ingresos</h2>
                <span class="page-panel-subtitle">Recepción de mercadería en bodega</span>
            </div>
        </div>
        <div class="page-header__actions">
            <button *ngIf="agregar" pButton icon="pi pi-plus" label="Nuevo" class="page-panel-primary-action" [routerLink]="['/ingresos/formulario']"></button>
        </div>
    </div>
    <div *ngIf="filtros" class="flex flex-column md:flex-row gap-1">
        <div *ngIf="filtros" class="flex flex-row gap-1 w-12">
            <input pInputText id="folio" (keydown.enter)="getData()" [(ngModel)]="filtro.id" placeholder="Buscar por folio" class="w-12" />
            <input pInputText id="oc" (keydown.enter)="getData()" [(ngModel)]="filtro.ordenCompra" placeholder="Buscar por OC" class="w-12" />
            <input pInputText id="documento" (keydown.enter)="getData()" [(ngModel)]="filtro.documento" placeholder="Buscar por documento" class="w-12" />
            <app-select-estado *ngIf="agregar && (esAdmin$ | async)" [(variable)]="filtro.estado" (ngModelChange)="getData()" [showClear]="true" class="w-12" />
            <button class="hidden md:flex w-12" [fluid]="true" pButton icon="pi pi-search" [severity]="'info'" [loading]="loading" (click)="getData()"></button>
        </div>
        <div *ngIf="filtros" class="flex flex-row gap-1 md:hidden">
            <button pButton icon="pi pi-search" label="Buscar" class="flex md:hidden w-12" [severity]="'info'" [loading]="loading" (click)="getData()"></button>
            <button class="flex md:hidden w-12" *ngIf="agregar && (esAdmin$ | async)" icon="pi pi-plus" label="Nuevo" [routerLink]="['/ingresos/formulario']"></button>
        </div>
    </div>
    <p-table class="hidden md:block w-12" [value]="data && data.content ? data.content : []" id="data-table" [loading]="loading" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th class="text-center">Folio</th>
                <th class="text-center">Estado</th>
                <th class="text-center">Fecha</th>
                <th class="text-center">Orden Compra</th>
                <th class="text-center">Documento</th>
                <th class="text-center">Documento Tipo</th>
                <th>
                    <button *ngIf="agregar && (esAdmin$ | async)" class="w-12" pButton icon="pi pi-plus" label="Nuevo" [routerLink]="['/ingresos/formulario']"></button>
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-item>
            <tr>
                <td class="text-center">
                    <span class="page-cell-code">{{ item.id }}</span>
                </td>
                <td class="text-center">
                    <ng-container [ngSwitch]="item.estado">
                        <p-tag *ngSwitchCase="0" severity="warn" value="Temporal" />
                        <p-tag *ngSwitchCase="1" severity="info" value="Abierto" />
                        <p-tag *ngSwitchCase="2" severity="success" value="Cerrado" />
                    </ng-container>
                </td>
                <td class="text-center">{{ item.fecha | fecha }}</td>
                <td class="text-center">{{ item.ordenCompra }}</td>
                <td class="text-center">{{ item.documento }}</td>
                <td class="text-center page-cell-muted">{{ item.documentoTipo?.nombre }}</td>
                <td class="text-center">
                    <p-button pTooltip="Editar" icon="pi pi-pencil" [rounded]="true" [text]="true" class="page-row-action" [routerLink]="['/ingresos/formulario/' + item.id]" />
                    <p-button pTooltip="Eliminar" icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (click)="confirmarEliminar(item)" />
                </td>
            </tr>
        </ng-template>
        <ng-template #summary>
            <p-paginator styleClass="page-paginator" (onPageChange)="pageChange($event)" [first]="filtro.page * filtro.size" [rows]="filtro.size" [totalRecords]="data ? data.totalElements : 0" [rowsPerPageOptions]="[10, 20, 30]" />
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="6">
                    <div class="page-empty">
                        <i class="pi pi-search"></i>
                        <strong>No se encontraron ingresos</strong>
                        <span>Prueba con otros filtros.</span>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
<app-table-mobile
    [card]="card"
    [size]="filtro.size"
    [page]="filtro.page"
    (pageChange)="pageChange($event)"
    [mostrarAcciones]="acciones"
    (accion)="resolverAccion($event)"
    [acciones]="accionesDevoluciones"
    [data]="data ? data.content : []"
    [campos]="campos"
></app-table-mobile>
<app-modal-loading [visible]="loading" />
<p-toast />
<p-confirmdialog #cIngreso key="cIngreso">
    <ng-template #message let-message>
        <div class="flex flex-col items-center w-full gap-4 border-b border-surface-200 dark:border-surface-700">
            <i class="pi pi-trash !text-6xl text-red-500"></i>
            <p>¿Está seguro de eliminar?</p>
        </div>
    </ng-template>
    <ng-template #footer>
        <p-button label="Cancelar" variant="text" icon="pi pi-times" class="w-12" [fluid]="true" severity="secondary" (click)="cIngreso.onReject()" />
        <p-button label="Eliminar" icon="pi pi-check" class="w-12" [fluid]="true" severity="danger" (click)="cIngreso.onAccept()" />
    </ng-template>
</p-confirmdialog>
