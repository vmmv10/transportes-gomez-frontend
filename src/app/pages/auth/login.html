<app-floating-configurator />
<div
    class="login-page"
    [ngStyle]="{
        'background-image': 'url(/assets/images/login.jpg)',
        'background-size': 'cover',
        'background-position': 'center',
        'background-repeat': 'no-repeat'}"
>
    <div class="login-page__backdrop"></div>

    <div class="login-page__content">
        <section class="login-card-shell">
            <div class="login-card-shell__accent"></div>

            <div class="login-card">
                <div class="login-card__header">
                    <div class="login-card__badge">Acceso seguro</div>

                    <div class="login-card__brand">
                        <p-image src="/assets/images/logo_transparente.png" alt="Logo Transporte Gomez" width="250" height="250" />
                    </div>

                    <div class="login-card__copy">
                        <h1>Bienvenido</h1>
                        <p>Ingresa a la plataforma para continuar con la operación logística.</p>
                    </div>
                </div>

                <div class="login-card__actions">
                    <p-button label="Iniciar Sesión" styleClass="login-button w-full" (click)="login()" severity="info"></p-button>
                </div>
            </div>
        </section>
    </div>
</div>
