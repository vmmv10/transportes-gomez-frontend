<div class="entregas-kpi-grid">
    <div *ngFor="let item of kpis.length ? kpis : placeholders" class="entregas-kpi-card">
        <span class="entregas-kpi-label"><i class="pi {{ icono(item.nombre) }}"></i>{{ item.nombre }}</span>
        <div class="entregas-kpi-value-row" *ngIf="!loading">
            <span class="entregas-kpi-value">{{ item.valor != null ? (item.valor | number: '1.0-2') : '—' }}</span>
            <span class="entregas-kpi-unit" *ngIf="item.valor != null">{{ item.unidad }}</span>
        </div>
        <i *ngIf="loading" class="pi pi-spin pi-spinner entregas-kpi-loading"></i>
    </div>
</div>
